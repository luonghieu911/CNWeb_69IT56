<html>
<head>

/* html font-size mặc định = 16px → 1rem = 16px */
html { font-size: 16px; }

body {
  font-family: Arial;
  padding: 20px;
  background: #f0f9ff;
}

/* === Absolute - px === */
.box-px {
  width: 300px;            /* luôn 300 pixel */
  border: 2px solid navy;  /* border luôn dùng px */
  padding: 16px;
  margin-bottom: 12px;
  background: white;
}

/* === rem - tương đối html (16px) === */
.box-rem {
  font-size: 1.5rem;       /* 1.5 × 16px = 24px */
  padding: 1rem;           /* 16px */
  margin-bottom: 0.75rem;  /* 12px */
  background: #fef3c7;
}
/* Đổi html font-size sẽ scale CẢ TRANG */
/* html { font-size: 20px; } → mọi rem tăng theo */

/* === em - tương đối font-size CHA === */
.parent-large {
  font-size: 20px;
  background: #d1fae5;
  padding: 12px;
}
.parent-large .child-em {
  font-size: 1.5em;     /* 1.5 × 20px = 30px (theo cha) */
  padding: 0.5em;       /* 0.5 × 30px = 15px (theo CHÍNH NÓ) */
  background: white;
}

/* === % - tương đối element cha === */
.bar {
  background: #ddd;
  height: 24px;
  margin: 8px 0;
  border-radius: 4px;
}
.fill { height: 100%; background: #0ea5e9; border-radius: 4px; }
.f30 { width: 30%; }
.f60 { width: 60%; }
.f90 { width: 90%; }

/* === vw, vh - viewport === */
.hero {
  width: 100%;          /* fill cha */
  height: 30vh;         /* 30% chiều cao màn hình */
  background: linear-gradient(135deg, #0ea5e9, #6366f1);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4vw;       /* font scale theo viewport */
  font-weight: bold;
  border-radius: 12px;
  margin: 12px 0;
}
</style>
</head>
<body>
  <h2>Absolute (px)</h2>
  <div class="box-px">300px - kích thước cố định</div>

  <h2>rem - theo &lt;html&gt; (mặc định 16px)</h2>

  <h2>em - theo CHA (cha 20px → 1.5em = 30px)</h2>

  <h2>vw, vh - viewport</h2>
  <div class="hero">Hero 30vh × 4vw</div>
</body>
</html>`,

      codeSnippet: `<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Arial; padding: 20px; background: #f8fafc;}
.demo {
  width: 100%;
  max-width: 600px;
  height: 200px;

  font-weight: bold;
  text-shadow: 0 2px 4px rgba(0,0,0,0.6);
}

/* === SHORTHAND - Gom mọi property === */
.short1 {
  /* Long form:
     background-color: #1e293b;
     background-image: url("...");
     background-position: center;
     background-size: cover;
     background-repeat: no-repeat;
  */
  /* Short: */
  background: #1e293b url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><circle cx='50' cy='50' r='40' fill='%23fbbf24' opacity='0.3'/></svg>") center/cover no-repeat;
}

/* === LINEAR GRADIENT === */
.grad1 {
  background: linear-gradient(to right, #0ea5e9, #6366f1);
}
.grad2 {
  background: linear-gradient(135deg, #f43f5e, #fbbf24, #10b981);
}
.grad3 {
  /* Có thể chỉ định stop position */
  background: linear-gradient(to bottom, #0ea5e9 0%, #0ea5e9 50%, #fbbf24 50%, #fbbf24 100%);
}

/* === RADIAL GRADIENT === */
.grad4 {
  background: radial-gradient(circle at center, #fbbf24, #ef4444);
}

/* === MULTI-LAYER (nhiều layer chồng nhau) === */
.multi1 {
  background:
    /* Layer 1 (trên cùng): overlay đen 50% */
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
    /* Layer 2: gradient màu */
    linear-gradient(135deg, #6366f1, #ec4899);
}

.multi2 {
  background:
    /* Layer 1: pattern dot */
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30'><circle cx='15' cy='15' r='2' fill='white' opacity='0.3'/></svg>"),
    /* Layer 2: gradient */
    linear-gradient(135deg, #1e293b, #0e7490);
}
</style>
</head>
<body>
<div class="demo short1">Shorthand: 1 dòng = 5 property</div>
<div class="demo grad1">linear-gradient (to right)</div>
<div class="demo grad2">3 màu, 135°</div>
<div class="demo grad3">Stripe (stop position)</div>
<div class="demo grad4">radial-gradient</div>
<div class="demo multi1">Multi-layer: overlay + gradient</div>
<div class="demo multi2">Multi-layer: dot pattern + gradient</div>
</body>
</html>`,

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modern CSS Reset</title>
<style>
  /* === 1. Universal box-sizing === */
  *, *::before, *::after { box-sizing: border-box; }

  /* === 2. Bỏ margin/padding mặc định === */
  body, h1, h2, h3, h4, h5, h6,
  p, figure, blockquote, dl, dd { margin: 0; }

  ul[role='list'], ol[role='list'] { list-style: none; padding: 0; }

  /* === 3. Body cơ bản === */
  body {
    min-height: 100vh;
    line-height: 1.6;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #0f172a;
    background: #ffffff;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  /* === 4. Typography hierarchy === */
  h1, h2, h3, h4 { line-height: 1.2; font-weight: 700; }

  /* === 5. Media tự co giãn === */
  img, picture, video, canvas, svg { display: block; max-width: 100%; }

  /* === 6. Form elements kế thừa font === */
  input, button, textarea, select { font: inherit; }

  /* === 7. Bỏ underline link mặc định cho :not within prose === */
  a:not([class]) { text-decoration-skip-ink: auto; }

  /* === 8. Loại bỏ animation cho người prefer-reduced-motion === */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  .demo {

    border: 1px solid #e2e8f0; border-radius: 12px;

      codeSnippet: `<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>:focus vs :focus-visible</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: Arial; padding: 30px; line-height: 1.8; }

  /* === ANTI-PATTERN === */
  /* button:focus { outline: none; } */  /* DUNG LAM THE NAY */

  /* === DUNG: dung :focus-visible === */
  button {
    padding: 10px 20px;
    background: #0891b2; color: white;
    border: 0; border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }

  /* Bỏ default outline khi click chuột */
  button:focus { outline: none; }

  /* CHỈ hiện focus ring khi user dùng bàn phím (Tab) */
  button:focus-visible {
    outline: 3px solid #f59e0b;
    outline-offset: 2px;
    box-shadow: 0 0 0 4px rgba(245,158,11,.2);
  }

  /* === Input cũng vậy === */

      <li><strong>Best practices</strong>: <code>prefers-reduced-motion</code>, <code>:focus-visible</code>, <code>scroll-behavior: smooth</code>, <code>@media print</code>.</li>

});

<script>
function escapeHtml(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderTable(t){
  if(!t) return '';
  let h='<div class="overflow-x-auto"><table class="data-table"><thead><tr>';
  t.headers.forEach(c=>h+='<th>'+escapeHtml(c)+'</th>');
  h+='</tr></thead><tbody>';
  t.rows.forEach(r=>{h+='<tr>';r.forEach(c=>h+='<td>'+(typeof c==='string'?c:escapeHtml(String(c)))+'</td>');h+='</tr>';});
  return h+'</tbody></table></div>';
}
function renderTheorySection(s){
  let html=`<div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow mb-5">
    <h3 class="text-lg font-bold text-cyan-900 mb-4 border-b border-slate-100 pb-2">${s.heading}</h3>
    <div class="prose-content space-y-2">`;
  if(s.paragraphs) s.paragraphs.forEach(p=>html+=`<p>${p}</p>`);
  if(s.list) html+='<ul>'+s.list.map(li=>`<li>${li}</li>`).join('')+'</ul>';
  if(s.note) html+=`<div class="info-box"><i class="fas fa-info-circle text-blue-500 mr-2"></i>${s.note}</div>`;
  if(s.warn) html+=`<div class="warn-box"><i class="fas fa-exclamation-triangle text-amber-500 mr-2"></i>${s.warn}</div>`;
  if(s.tip) html+=`<div class="tip-box"><i class="fas fa-lightbulb text-emerald-500 mr-2"></i>${s.tip}</div>`;
  if(s.danger) html+=`<div class="danger-box"><i class="fas fa-times-circle text-red-500 mr-2"></i>${s.danger}</div>`;
  if(s.table) html+=renderTable(s.table);
  html+='</div>';
  if(s.codeSnippet){
    const lang = s.codeLang || 'html';
    html+=`<div class="mt-4 rounded-lg overflow-hidden shadow-inner border border-slate-700">
      <div class="bg-[#2d2d2d] px-4 py-2 border-b border-slate-700 flex items-center justify-between text-xs text-slate-300 uppercase tracking-wider">
        <div><i class="fas fa-file-code mr-2 text-cyan-400"></i> ${s.codeLabel||'Mã HTML+CSS minh họa'}</div>
        <button onclick="openPlaygroundFromBtn(this)" class="run-snippet-btn"><i class="fas fa-play mr-1"></i> Chạy thử</button>
      </div>
      <pre class="m-0"><code class="language-${lang}">${escapeHtml(s.codeSnippet)}</code></pre>
    </div>`;
  }
  if(s.diagram) html+=s.diagram;
  return html+'</div>';
}
function renderQuiz(quiz, chapterId){
  if(!quiz||!quiz.length) return '';
  let html=`<div class="bg-white p-6 rounded-xl border-2 border-cyan-200 shadow-sm mt-6">
    <h3 class="text-xl font-bold text-cyan-700 mb-4 flex items-center">
      <i class="fas fa-clipboard-question mr-2"></i> Trắc nghiệm kiểm tra (${quiz.length} câu)
    </h3>
    <div id="quiz-${chapterId}" class="space-y-5">`;
  quiz.forEach((q,i)=>{
    html+=`<div class="border-b pb-4" data-question="${i}">
      <p class="font-semibold text-slate-800 mb-3">Câu ${i+1}: ${q.q}</p>
      <div class="space-y-2">`;
    q.opts.forEach((opt,j)=>{
      html+=`<button class="quiz-option w-full text-left px-4 py-2 border-2 border-slate-200 rounded-lg text-sm"
        onclick="answerQuiz(${chapterId},${i},${j},${q.a})">${String.fromCharCode(65+j)}. ${escapeHtml(opt)}</button>`;
    });
    html+=`</div><div class="mt-2 text-sm hidden" id="explain-${chapterId}-${i}">
      <div class="info-box"><strong>Giải thích:</strong> ${q.exp||''}</div></div></div>`;
  });
  html+=`</div>
    <div class="mt-4 flex items-center justify-between">
      <div class="text-sm text-slate-600">Điểm: <span id="quiz-score-${chapterId}" class="font-bold text-cyan-700">0</span>/${quiz.length}</div>
      <button onclick="resetQuiz(${chapterId},${quiz.length})" class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1 rounded">
        <i class="fas fa-redo mr-1"></i> Làm lại
      </button>
    </div>
  </div>`;
  return html;
}
function answerQuiz(cid,qi,opt,correct){
  const wrap=document.querySelector(`#quiz-${cid} [data-question="${qi}"]`);
  if(wrap.dataset.answered==='1') return;
  wrap.dataset.answered='1';
  const btns=wrap.querySelectorAll('.quiz-option');
  btns.forEach((b,i)=>{
    if(i===correct) b.classList.add('correct');
    if(i===opt && i!==correct) b.classList.add('wrong');
    b.disabled=true;
  });
  document.getElementById(`explain-${cid}-${qi}`).classList.remove('hidden');
  if(opt===correct){
    let s=parseInt(document.getElementById(`quiz-score-${cid}`).innerText)+1;
    document.getElementById(`quiz-score-${cid}`).innerText=s;
  }
}
function resetQuiz(cid,total){
  const root=document.getElementById(`quiz-${cid}`);
  root.querySelectorAll('[data-question]').forEach(w=>{
    delete w.dataset.answered;
    w.querySelectorAll('.quiz-option').forEach(b=>{b.classList.remove('correct','wrong');b.disabled=false;});
    const idx=w.getAttribute('data-question');
    document.getElementById(`explain-${cid}-${idx}`).classList.add('hidden');
  });
  document.getElementById(`quiz-score-${cid}`).innerText='0';
}
function renderPractices(practices, chapterId){

// LIVE PLAYGROUND - Chạy code HTML+CSS trực tiếp
// ========================================
let _pgOriginalCode = '';

function openPlaygroundFromBtn(btn){
  let parent = btn.parentElement;
  while (parent && !parent.querySelector('pre code')) {
    parent = parent.parentElement;
  }
  const pre = parent ? parent.querySelector('pre code') : null;
  const code = pre ? pre.textContent : '';
  openPlayground(code);
}

function openPlayground(code){
  _pgOriginalCode = code;
  document.getElementById('pg-code').value = code;
  document.getElementById('pg-modal').classList.add('open');
  setTimeout(()=>runPlaygroundCode(), 80);
}

function closePlayground(){
  document.getElementById('pg-modal').classList.remove('open');
  document.getElementById('pg-preview').srcdoc = '';
}

function resetPlayground(){
  document.getElementById('pg-code').value = _pgOriginalCode;
  runPlaygroundCode();
}

function runPlaygroundCode(){
  const code = document.getElementById('pg-code').value;
  const iframe = document.getElementById('pg-preview');
  const isFullHtml = /<!DOCTYPE|<html|<body|<head/i.test(code);
  // Nếu là CSS thuần (không có HTML), wrap trong demo HTML mặc định
  const isPureCss = !isFullHtml && !/<[a-z]/i.test(code) && /[{}:;]/.test(code);

  let html;
  if (isFullHtml){
    html = code;
  } else if (isPureCss) {
    // CSS thuần → wrap với demo HTML
    html = '<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{font-family:system-ui,sans-serif;padding:20px;}</style><style>' + code + '</style></head><body>' +
      '<div class="demo-area"><h1>Heading H1</h1><h2>Heading H2</h2><p>Đoạn văn mẫu để xem CSS áp dụng. <a href="#">Link mẫu</a></p>' +
      '<button>Nút bấm</button> <input type="text" placeholder="Input">' +
      '<ul><li>Item 1</li><li>Item 2</li><li>Item 3</li></ul>' +
      '<div class="box">Box .box</div><div class="container">Box .container</div>' +
      '</div></body></html>';
  } else {
    // HTML có inline CSS hoặc fragment → wrap nguyên trong document
    html = '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>' + code + '</body></html>';
  }
  iframe.srcdoc = html;
}

// Phím tắt trong playground
document.addEventListener('keydown', function(e){
  const modal = document.getElementById('pg-modal');
  if (!modal || !modal.classList.contains('open')) return;
  if (e.key === 'Escape'){ closePlayground(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
    e.preventDefault();
    runPlaygroundCode();
  }
  if (e.key === 'Tab' && e.target.id === 'pg-code'){
    e.preventDefault();
    const ta = e.target;
    const s = ta.selectionStart, en = ta.selectionEnd;
    ta.value = ta.value.substring(0, s) + '  ' + ta.value.substring(en);
    ta.selectionStart = ta.selectionEnd = s + 2;
  }
});
</script>

<!-- Playground Modal -->
<div id="pg-modal" class="pg-modal"
     onmousedown="window._pgMouseDownTarget=event.target"
     onmouseup="if(event.target===this && window._pgMouseDownTarget===this)closePlayground(); window._pgMouseDownTarget=null;">
  <div class="pg-content">
    <div class="pg-header">
      <div class="flex items-center">
        <i class="fas fa-play-circle text-emerald-400 text-xl mr-2"></i>
        <h2 class="font-bold text-base">Playground - Chạy HTML+CSS trực tiếp</h2>
        <span class="ml-3 text-xs text-slate-300">Edit code bên trái → Ctrl+Enter để chạy</span>
      </div>
      <button onclick="closePlayground()" class="text-slate-300 hover:text-white text-2xl leading-none px-2" title="Đóng (Esc)">&times;</button>
    </div>
    <div class="pg-body">
      <div class="pg-pane">
        <div class="pg-pane-header"><span><i class="fas fa-code mr-1"></i> Code HTML+CSS (có thể chỉnh sửa)</span></div>
        <textarea id="pg-code" spellcheck="false" autocomplete="off"></textarea>
      </div>
      <div class="pg-pane">
        <div class="pg-pane-header">
          <span><i class="fas fa-window-restore mr-1"></i> Live Preview</span>
        </div>
        <iframe id="pg-preview" sandbox="allow-scripts allow-modals allow-forms"></iframe>
      </div>
    </div>
    <div class="pg-toolbar">
      <button onclick="runPlaygroundCode()" class="pg-btn pg-btn-run"><i class="fas fa-play mr-1"></i> Chạy (Ctrl+Enter)</button>
      <button onclick="resetPlayground()" class="pg-btn pg-btn-secondary"><i class="fas fa-undo mr-1"></i> Reset code gốc</button>
      <span class="ml-auto text-xs text-slate-500">💡 Edit code và xem CSS thay đổi tức thì</span>
    </div>
  </div>
</div>

</body>
</html>
